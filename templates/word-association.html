<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Word Association — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/modals.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/page-header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/cst-activities.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/memoire-icon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/memoire-icon.png') }}">
  <meta property="og:title" content="Mémoire">
  <meta property="og:description" content="Your gentle memory companion">
  <meta property="og:image" content="https://my-memoire.vercel.app/static/assets/memoire-icon.png">
  <meta property="og:url" content="https://my-memoire.vercel.app">
  <meta property="og:type" content="website">
</head>
<body data-cst-activity="word-association">
  <main class="cst-activity cst-wa">
    <header class="cst-activity__header page-header">
      <a href="/activities" class="cst-activity__back page-header__back" aria-label="Back to activities">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="cst-activity__title page-header__title">Word Association</h1>
    </header>

    <div class="cst-activity__content">
      <section class="cst-wa__card card-base" id="wa-game" aria-live="polite">
        <div class="cst-wa__prompt-zone is-visible" id="wa-prompt-zone">
          <div class="cst-wa__illustration" id="wa-prompt-image" aria-hidden="true"></div>
          <p class="cst-wa__intro">What word goes with&hellip;</p>
          <h2 class="cst-wa__word" id="wa-prompt-word"></h2>
          <button type="button" class="cst-wa__replay" id="wa-replay-word" aria-label="Hear the word and choices">
            <span class="cst-wa__replay-icon" aria-hidden="true">🔊</span>
          </button>
        </div>
        <div class="cst-wa__options" id="wa-options" role="group" aria-label="Word choices"></div>
      </section>

      <div class="cst-activity__exit" id="wa-exit-footer">
        <button type="button" class="cst-activity__exit-done" id="wa-done-today">I&rsquo;m done for today</button>
        <a href="/dashboard" class="cst-activity__exit-home" id="wa-back-home">
          <svg class="cst-activity__exit-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
          </svg>
          Back to Home
        </a>
      </div>

      <section class="cst-wa__done card-base" id="wa-session-done" hidden>
        <div class="cst-wa__done-visual" aria-hidden="true">
          <svg class="cst-wa__done-stars" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
            <polygon points="16,4 18,10 24,10 19,14 21,20 16,16 11,20 13,14 8,10 14,10" fill="var(--color-orange)"/>
            <polygon points="60,2 61.5,6 66,6 62.5,8.5 64,12 60,10 56,12 57.5,8.5 54,6 58.5,6" fill="var(--color-orange)" opacity="0.7"/>
            <polygon points="104,4 106,10 112,10 107,14 109,20 104,16 99,20 101,14 96,10 102,10" fill="var(--color-orange)"/>
          </svg>
          <svg class="cst-wa__done-flower" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle class="cst-wa__done-glow" cx="50" cy="50" r="42" fill="var(--color-orange)" opacity="0.15"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(0 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(60 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(120 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(180 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(240 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(300 50 50)"/>
            <circle cx="50" cy="50" r="14" fill="var(--color-orange)"/>
          </svg>
        </div>
        <p class="cst-wa__done-message">Lovely time together today!</p>
        <div class="cst-wa__done-actions">
          <a href="/activities" class="cst-wa__done-btn">Back to Activities</a>
          <button type="button" class="cst-wa__more-btn" id="wa-done-more">I&rsquo;d like a few more</button>
        </div>
      </section>
    </div>
  </main>

  <nav class="dashboard-nav" aria-label="Main navigation">
    <a href="/dashboard" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
      <span class="dashboard-nav__label">Home</span>
    </a>
    <a href="/companion" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="dashboard-nav__label">Companion</span>
    </a>
    <a href="/activities" class="dashboard-nav__item dashboard-nav__item--active" aria-current="page">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="dashboard-nav__label">Activities</span>
    </a>
    <a href="/profile" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-.5C4 16.9 7.6 14 12 14s8 2.9 8 6.5V21H4z"/></svg>
      <span class="dashboard-nav__label">Profile</span>
    </a>
  </nav>

  <div
    id="wa-feedback-modal"
    class="modal-overlay cst-wa-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="wa-modal-heading"
    hidden
  >
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="cst-wa-modal__heading" id="wa-modal-heading">Lovely!</h2>
      </div>
      <div class="modal-body">
        <div id="wa-modal-body">
          <p class="cst-wa-modal__choice" id="wa-modal-choice"></p>
          <p class="cst-wa-modal__warm" id="wa-modal-warm"></p>
          <button type="button" class="cst-wa__replay" id="wa-speak-warm" aria-label="Hear the message">
            <span class="cst-wa__replay-icon" aria-hidden="true">🔊</span>
          </button>
          <div class="cst-wa-modal__reminisce" id="wa-modal-reminisce">
            <button type="button" class="cst-wa-modal__add-memory" id="wa-add-memory">Add a memory about this</button>
          </div>
        </div>
        <div class="cst-wa-modal__closing" id="wa-modal-closing" hidden>
          <div class="cst-wa__done-visual cst-wa__done-visual--compact" aria-hidden="true">
            <svg class="cst-wa__done-stars" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
              <polygon points="16,4 18,10 24,10 19,14 21,20 16,16 11,20 13,14 8,10 14,10" fill="var(--color-orange)"/>
              <polygon points="60,2 61.5,6 66,6 62.5,8.5 64,12 60,10 56,12 57.5,8.5 54,6 58.5,6" fill="var(--color-orange)" opacity="0.7"/>
              <polygon points="104,4 106,10 112,10 107,14 109,20 104,16 99,20 101,14 96,10 102,10" fill="var(--color-orange)"/>
            </svg>
            <svg class="cst-wa__done-flower" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle class="cst-wa__done-glow" cx="50" cy="50" r="42" fill="var(--color-orange)" opacity="0.15"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(0 50 50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(60 50 50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(120 50 50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(180 50 50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(240 50 50)"/>
              <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--navy)" transform="rotate(300 50 50)"/>
              <circle cx="50" cy="50" r="14" fill="var(--color-orange)"/>
            </svg>
          </div>
          <p class="cst-wa-modal__closing-text">Lovely time together today!</p>
          <div class="cst-wa__done-actions">
            <a href="/activities" class="cst-wa__done-btn">Back to Activities</a>
            <button type="button" class="cst-wa__more-btn" id="wa-modal-more">I&rsquo;d like a few more</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <div class="cst-wa-modal__actions" id="wa-modal-actions">
          <button type="button" class="cst-wa-modal__next" id="wa-next-word">Next Word</button>
        </div>
      </div>
    </div>
  </div>

  <div id="add-memory-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="memory-modal-title" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <p class="modal-title" id="memory-modal-title">Add a Memory</p>
      </div>
      <form id="add-memory-form" class="memory-form modal-form">
        <div class="modal-body">
          <div class="memory-form__field">
            <label for="memory-text">What happened today?</label>
            <textarea id="memory-text" name="memory-text" rows="3" placeholder="A short note about your day…" required></textarea>
          </div>
          <div class="memory-form__field">
            <span class="memory-form__label">Photo <span class="memory-form__optional">(optional)</span></span>
            <div class="photo-upload">
              <div class="photo-preview photo-preview--memory" id="memory-photo-preview">
                <svg class="photo-preview__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.75"/>
                  <path d="M21 15l-5-5L5 21"/>
                </svg>
                <span class="photo-preview__text">Tap to add<br>a photo</span>
              </div>
              <input type="file" id="memory-photo" name="memory-photo" accept="image/*">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="modal-actions">
            <button type="button" id="memory-modal-cancel" class="modal-btn modal-btn--secondary">Cancel</button>
            <button type="submit" class="modal-btn modal-btn--primary">Save Memory</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="memory-toast" class="cst-activity-toast" role="status" aria-live="polite" hidden>Memory saved!</div>

  <script src="{{ url_for('static', filename='js/core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/add-memory.js') }}"></script>
  <script src="{{ url_for('static', filename='js/activities/shared.js') }}"></script>
  <script src="{{ url_for('static', filename='js/activities/word-association.js') }}"></script>
</body>
</html>
