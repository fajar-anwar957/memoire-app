<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Welcome-Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/onboarding.css') }}">
</head>
<body>
  <main class="onboarding">
    <header class="onboarding__brand">
      <svg class="onboarding__flower" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(60, 60)">
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(0)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(60)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(120)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(180)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(240)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="var(--navy)" transform="rotate(300)"/>
        </g>
        <circle cx="60" cy="60" r="12" fill="var(--orange)"/>
      </svg>
      <p class="onboarding__logo-text">Mémoire</p>
    </header>

    <h1 class="onboarding__heading">Welcome. Who are you setting this up for?</h1>

    <div class="onboarding__cards">
      <a href="/profile?mode=self" class="onboarding-card">
        <span class="onboarding-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M6 21v-1a6 6 0 0 1 12 0v1"/>
          </svg>
        </span>
        <h2 class="onboarding-card__title">For Me</h2>
        <p class="onboarding-card__subtext">I will be using Mémoire myself</p>
      </a>

      <a href="/profile?mode=caregiver" class="onboarding-card">
        <span class="onboarding-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <h2 class="onboarding-card__title">For Someone I Care For</h2>
        <p class="onboarding-card__subtext">I am setting this up for a loved one</p>
      </a>
    </div>

    <p class="onboarding__privacy">Your information stays on this device and is never shared.</p>
  </main>
</body>
</html>
