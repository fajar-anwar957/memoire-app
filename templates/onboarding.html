<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 2.5rem;
    }

    .onboarding {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .onboarding__brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .onboarding__flower {
      width: 60px;
      height: 60px;
      margin-bottom: 0.75rem;
    }

    .onboarding__logo-text {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-navy);
      letter-spacing: 0.02em;
    }

    .onboarding__heading {
      margin: 0 0 2.25rem;
      max-width: 28rem;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--color-navy);
    }

    .onboarding__cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
      margin-bottom: 2.5rem;
    }

    .onboarding-card {
      flex: 1 1 280px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.25rem 1.75rem 2rem;
      background: #ffffff;
      border: 2px solid var(--color-navy);
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(27, 58, 92, 0.08);
      transition:
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
      cursor: pointer;
    }

    .onboarding-card:hover,
    .onboarding-card:focus-visible {
      border-color: var(--color-orange);
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(217, 114, 44, 0.18);
      outline: none;
    }

    .onboarding-card:focus-visible {
      outline: 3px solid rgba(27, 58, 92, 0.45);
      outline-offset: 3px;
    }

    .onboarding-card__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin-bottom: 1.25rem;
      border-radius: 50%;
      background: rgba(27, 58, 92, 0.07);
      color: var(--color-navy);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .onboarding-card:hover .onboarding-card__icon,
    .onboarding-card:focus-visible .onboarding-card__icon {
      background: rgba(217, 114, 44, 0.12);
      color: var(--color-orange);
    }

    .onboarding-card__icon svg {
      width: 36px;
      height: 36px;
    }

    .onboarding-card__title {
      margin: 0 0 0.625rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-navy);
    }

    .onboarding-card__subtext {
      margin: 0;
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--color-text-muted);
    }

    .onboarding__privacy {
      margin: 0;
      max-width: 22rem;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--color-text-muted);
    }

    @media (max-width: 640px) {
      .onboarding__heading {
        font-size: 1.3125rem;
      }

      .onboarding__cards {
        flex-direction: column;
        align-items: center;
      }

      .onboarding-card {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="onboarding">
    <header class="onboarding__brand">
      <svg class="onboarding__flower" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(60, 60)">
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(0)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(60)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(120)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(180)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(240)"/>
          <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(300)"/>
        </g>
        <circle cx="60" cy="60" r="12" fill="#D9722C"/>
      </svg>
      <p class="onboarding__logo-text">Mémoire</p>
    </header>

    <h1 class="onboarding__heading">Welcome. Who are you setting this up for?</h1>

    <div class="onboarding__cards">
      <a href="/profile?mode=self" class="onboarding-card">
        <span class="onboarding-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M6 21v-1a6 6 0 0 1 12 0v1"/>
          </svg>
        </span>
        <h2 class="onboarding-card__title">For Me</h2>
        <p class="onboarding-card__subtext">I will be using Mémoire myself</p>
      </a>

      <a href="/profile?mode=caregiver" class="onboarding-card">
        <span class="onboarding-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <h2 class="onboarding-card__title">For Someone I Care For</h2>
        <p class="onboarding-card__subtext">I am setting this up for a loved one</p>
      </a>
    </div>

    <p class="onboarding__privacy">Your information stays on this device and is never shared.</p>
  </main>
</body>
</html>
