<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Daily Quiz — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/page-header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/cst-activities.css') }}">
</head>
<body data-cst-activity="daily-quiz">
  <main class="cst-activity cst-dq">
    <header class="cst-activity__header page-header">
      <a href="/activities" class="cst-activity__back page-header__back" aria-label="Back to activities">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="cst-activity__title page-header__title">Daily Quiz</h1>
    </header>

    <div class="cst-activity__content">
      <section class="cst-wa__card card-base cst-dq__card" id="dq-loading" aria-live="polite" hidden>
        <p class="cst-dq__loading-message">Getting today&rsquo;s quiz ready&hellip;</p>
      </section>

      <section class="cst-wa__card card-base cst-dq__card" id="dq-game" aria-live="polite" hidden>
        <div class="cst-dq__progress" id="dq-progress" aria-hidden="true"></div>
        <div class="cst-wa__prompt-zone cst-dq__prompt-zone is-visible" id="dq-prompt-zone">
          <div class="cst-dq__motif" id="dq-motif" aria-hidden="true"></div>
          <p class="cst-wa__intro cst-dq__intro">A gentle question for you</p>
          <h2 class="cst-pr__question cst-dq__question" id="dq-question"></h2>
          <button type="button" class="cst-wa__replay" id="dq-speak-question" aria-label="Hear the question">
            <span class="cst-wa__replay-icon" aria-hidden="true">🔊</span>
          </button>
        </div>
        <div class="cst-wa__options cst-dq__options" id="dq-options" role="group" aria-label="Answer choices"></div>
      </section>

      <section class="cst-wa__done card-base cst-dq__card" id="dq-session-done" hidden>
        <div class="cst-wa__done-visual" aria-hidden="true">
          <svg class="cst-wa__done-stars" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
            <polygon points="16,4 18,10 24,10 19,14 21,20 16,16 11,20 13,14 8,10 14,10" fill="var(--color-orange)"/>
            <polygon points="60,2 61.5,6 66,6 62.5,8.5 64,12 60,10 56,12 57.5,8.5 54,6 58.5,6" fill="var(--color-orange)" opacity="0.7"/>
            <polygon points="104,4 106,10 112,10 107,14 109,20 104,16 99,20 101,14 96,10 102,10" fill="var(--color-orange)"/>
          </svg>
          <svg class="cst-wa__done-flower" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle class="cst-wa__done-glow" cx="50" cy="50" r="42" fill="var(--color-orange)" opacity="0.15"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(0 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(60 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(120 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(180 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(240 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(300 50 50)"/>
            <circle cx="50" cy="50" r="14" fill="var(--color-orange)"/>
          </svg>
        </div>
        <p class="cst-wa__done-message" id="dq-done-message">Lovely time together today!</p>
        <div class="cst-wa__done-actions" id="dq-done-actions">
          <a href="/activities" class="cst-wa__done-btn">Done for Today</a>
          <button type="button" class="cst-wa__more-btn" id="dq-done-more">I&rsquo;d like a few more</button>
        </div>
      </section>
    </div>
  </main>

  <div
    id="dq-feedback-modal"
    class="cst-wa-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dq-modal-heading"
    hidden
  >
    <div class="cst-wa-modal__card">
      <div id="dq-modal-body">
        <h2 class="cst-wa-modal__heading" id="dq-modal-heading">Lovely!</h2>
        <p class="cst-wa-modal__warm" id="dq-modal-warm"></p>
        <button type="button" class="cst-wa__replay" id="dq-speak-warm" aria-label="Hear the message">
          <span class="cst-wa__replay-icon" aria-hidden="true">🔊</span>
        </button>
      </div>
      <div class="cst-wa-modal__actions" id="dq-modal-actions">
        <button type="button" class="cst-wa-modal__next" id="dq-next-question">Next Question</button>
        <button type="button" class="cst-wa-modal__done-early" id="dq-done-early">I&rsquo;m done for today</button>
      </div>
      <div class="cst-wa-modal__closing" id="dq-modal-closing" hidden>
        <div class="cst-wa__done-visual cst-wa__done-visual--compact" aria-hidden="true">
          <svg class="cst-wa__done-stars" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
            <polygon points="16,4 18,10 24,10 19,14 21,20 16,16 11,20 13,14 8,10 14,10" fill="var(--color-orange)"/>
            <polygon points="60,2 61.5,6 66,6 62.5,8.5 64,12 60,10 56,12 57.5,8.5 54,6 58.5,6" fill="var(--color-orange)" opacity="0.7"/>
            <polygon points="104,4 106,10 112,10 107,14 109,20 104,16 99,20 101,14 96,10 102,10" fill="var(--color-orange)"/>
          </svg>
          <svg class="cst-wa__done-flower" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle class="cst-wa__done-glow" cx="50" cy="50" r="42" fill="var(--color-orange)" opacity="0.15"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(0 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(60 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(120 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(180 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(240 50 50)"/>
            <ellipse cx="50" cy="22" rx="10" ry="18" fill="var(--color-navy)" transform="rotate(300 50 50)"/>
            <circle cx="50" cy="50" r="14" fill="var(--color-orange)"/>
          </svg>
        </div>
        <p class="cst-wa-modal__closing-text">Lovely time together today!</p>
        <div class="cst-wa__done-actions">
          <a href="/activities" class="cst-wa__done-btn">Done for Today</a>
          <button type="button" class="cst-wa__more-btn" id="dq-modal-more">I&rsquo;d like a few more</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/activities/shared.js') }}"></script>
  <script src="{{ url_for('static', filename='js/activities/daily-quiz.js') }}"></script>
</body>
</html>
