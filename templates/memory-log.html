<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories &amp; People — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/modals.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/page-header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/memory-log.css') }}">
</head>
<body>
  <main class="memory-log">
    <header class="memory-log__header page-header">
      <a href="/dashboard" class="memory-log__back page-header__back" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="memory-log__title page-header__title">Memories &amp; People</h1>
    </header>

    <div class="memory-log__shell">
      <div class="memory-log__layout">
      <aside class="memory-log__people-panel" aria-labelledby="memory-log-people-heading">
        <h2 class="memory-log__panel-title" id="memory-log-people-heading">
          <span class="memory-log__panel-accent" aria-hidden="true">♥</span>
          Your People
        </h2>

        <p id="memory-log-people-quiet" class="memory-log__people-quiet" hidden>No people added yet</p>

        <div id="memory-log-people-list" class="memory-log__people-list"></div>

        <button type="button" class="memory-log__add-person-btn" id="memory-log-add-person-btn" aria-haspopup="dialog" aria-controls="add-person-modal">+ Add a person</button>
      </aside>

      <section class="memory-log__memories-panel" aria-labelledby="memory-log-memories-heading">
        <div class="memory-log__memories-toolbar">
          <h2 class="memory-log__panel-title" id="memory-log-memories-heading">
            <span class="memory-log__panel-accent" aria-hidden="true">✿</span>
            Your Memories
          </h2>
          <button type="button" class="memory-log__add-memory-btn" id="memory-log-add-btn" aria-haspopup="dialog" aria-controls="add-memory-modal">
            + Add a memory
          </button>
        </div>

        <div id="memory-log-feed" class="memory-log__feed" hidden></div>

        <div id="memory-log-memories-empty" class="memory-log__memories-empty" hidden>
          <svg class="memory-log__empty-flower" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="translate(60, 60)">
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(0)"/>
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(60)"/>
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(120)"/>
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(180)"/>
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(240)"/>
              <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(300)"/>
            </g>
            <circle cx="60" cy="60" r="12" fill="#D9722C"/>
          </svg>
          <p class="memory-log__empty-text">No memories yet — add your first one 🌼</p>
          <button type="button" class="memory-log__add-memory-btn memory-log__add-memory-btn--empty" id="memory-log-empty-add-btn" aria-haspopup="dialog" aria-controls="add-memory-modal">
            + Add a memory
          </button>
        </div>
      </section>
      </div>
    </div>
  </main>

  <nav class="dashboard-nav" aria-label="Main navigation">
    <a href="/dashboard" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
      </svg>
      <span class="dashboard-nav__label">Home</span>
    </a>
    <a href="/companion" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="dashboard-nav__label">Companion</span>
    </a>
    <a href="/activities" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span class="dashboard-nav__label">Activities</span>
    </a>
    <a href="/profile" class="dashboard-nav__item">
      <svg class="dashboard-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 21v-1a6 6 0 0 1 12 0v1"/>
      </svg>
      <span class="dashboard-nav__label">Profile</span>
    </a>
  </nav>

  <div id="memory-toast" class="memory-log-toast" role="status" aria-live="polite" hidden>Memory saved!</div>

  <div id="add-person-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="person-modal-title" hidden>
    <div class="modal-card">
      <p class="modal-title" id="person-modal-title">Add someone special</p>
      <form id="add-person-form" class="memory-form" novalidate>
        <div class="memory-form__field">
          <span class="memory-form__label">Photo <span class="memory-form__optional">(optional)</span></span>
          <div class="photo-upload photo-upload--small">
            <div class="photo-preview" id="person-photo-preview">
              <svg class="photo-preview__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.75"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span class="photo-preview__text">Add photo</span>
            </div>
            <input type="file" id="person-photo" name="person-photo" accept="image/*">
          </div>
        </div>
        <div class="memory-form__field" id="person-name-field">
          <label for="person-name">Name</label>
          <input type="text" id="person-name" name="person-name" autocomplete="name">
          <p class="memory-form__error" id="person-name-error" hidden>Please enter a name</p>
        </div>
        <div class="memory-form__field">
          <label for="person-relationship">About them</label>
          <input type="text" id="person-relationship" name="person-relationship" placeholder="e.g. Daughter, lives nearby, loves gardening" autocomplete="off">
        </div>
        <div class="modal-actions">
          <button type="button" id="person-modal-cancel" class="modal-btn modal-btn--secondary">Cancel</button>
          <button type="submit" class="modal-btn modal-btn--primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="add-memory-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="memory-modal-title" hidden>
    <div class="modal-card">
      <p class="modal-title" id="memory-modal-title">Add a Memory</p>
      <form id="add-memory-form" class="memory-form">
        <div class="memory-form__field">
          <label for="memory-text">What happened today?</label>
          <textarea id="memory-text" name="memory-text" rows="3" placeholder="A short note about your day…" required></textarea>
        </div>
        <div class="memory-form__field">
          <span class="memory-form__label">Photo <span class="memory-form__optional">(optional)</span></span>
          <div class="photo-upload">
            <div class="photo-preview photo-preview--memory" id="memory-photo-preview">
              <svg class="photo-preview__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.75"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span class="photo-preview__text">Tap to add<br>a photo</span>
            </div>
            <input type="file" id="memory-photo" name="memory-photo" accept="image/*">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="memory-modal-cancel" class="modal-btn modal-btn--secondary">Cancel</button>
          <button type="submit" class="modal-btn modal-btn--primary">Save Memory</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/add-memory.js') }}"></script>
  <script src="{{ url_for('static', filename='js/memory-log.js') }}"></script>
</body>
</html>
