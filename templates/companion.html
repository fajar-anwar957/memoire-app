<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Companion — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/companion.css') }}">
</head>
<body>
  <div class="companion">
    <header class="companion__header">
      <a href="/dashboard" class="companion__back" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="companion__title">Your Companion</h1>
    </header>

    <div class="companion__chat" id="companion-chat" role="log" aria-live="polite" aria-label="Chat messages">
      <div class="companion-message companion-message--companion">
        <span class="companion-message__label">Mémoire</span>
        <p class="companion-message__bubble">Hello! It is lovely to see you today. How are you feeling?</p>
      </div>

      <div class="companion-message companion-message--patient">
        <p class="companion-message__bubble">I am feeling good, thank you.</p>
      </div>

      <div class="companion-message companion-message--companion">
        <span class="companion-message__label">Mémoire</span>
        <p class="companion-message__bubble">That is wonderful to hear. Would you like to chat or do an activity together?</p>
      </div>
    </div>

    <form class="companion__input-bar" id="companion-form" action="#" method="post">
      <label class="companion__input-label" for="companion-input">Type a message</label>
      <input
        type="text"
        id="companion-input"
        class="companion__input"
        placeholder="Type a message..."
        autocomplete="off"
      >
      <button type="submit" class="companion__send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
      <button type="button" class="companion__mic" id="companion-mic" aria-label="Voice input">
        <svg class="companion__mic-flower" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g transform="translate(60, 60)">
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(0)"/>
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(60)"/>
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(120)"/>
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(180)"/>
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(240)"/>
            <ellipse cx="0" cy="-30" rx="10" ry="18" fill="#1B3A5C" transform="rotate(300)"/>
          </g>
          <circle cx="60" cy="60" r="12" fill="#D9722C"/>
        </svg>
      </button>
    </form>
  </div>

  <nav class="dashboard-nav" aria-label="Main navigation">
    <a href="/dashboard" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Home</span>
    </a>
    <a href="/companion" class="dashboard-nav__item dashboard-nav__item--active" aria-current="page">
      <span class="dashboard-nav__label">Companion</span>
    </a>
    <a href="/activities" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Activities</span>
    </a>
    <a href="/profile" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Profile</span>
    </a>
  </nav>

  <script>
    (function () {
      var chat = document.getElementById('companion-chat');
      var form = document.getElementById('companion-form');
      var input = document.getElementById('companion-input');
      var mic = document.getElementById('companion-mic');

      function scrollChatToBottom() {
        chat.scrollTop = chat.scrollHeight;
      }

      function appendPatientMessage(text) {
        var message = document.createElement('div');
        message.className = 'companion-message companion-message--patient';

        var bubble = document.createElement('p');
        bubble.className = 'companion-message__bubble';
        bubble.textContent = text;

        message.appendChild(bubble);
        chat.appendChild(message);
        scrollChatToBottom();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var text = input.value.trim();
        if (!text) {
          return;
        }
        appendPatientMessage(text);
        input.value = '';
        input.focus();
      });

      mic.addEventListener('click', function () {
        mic.classList.toggle('companion__mic--active');
      });

      scrollChatToBottom();
    })();
  </script>
</body>
</html>
