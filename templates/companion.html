<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Companion — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/nav.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/companion.css') }}">
</head>
<body>
  <div class="companion">
    <header class="companion__header">
      <a href="/dashboard" class="companion__back" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="companion__title">Your Companion</h1>
    </header>

    <div class="companion__chat" id="companion-chat" role="log" aria-live="polite" aria-label="Chat messages"></div>

    <form class="companion__input-bar" id="companion-form" action="#" method="post">
      <label class="companion__input-label" for="companion-input">Type a message</label>
      <input
        type="text"
        id="companion-input"
        class="companion__input"
        placeholder="Type a message..."
        autocomplete="off"
      >
      <button type="submit" class="companion__send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2L11 13"/>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
      <button type="button" class="companion__mic" id="companion-mic" aria-label="Voice input">
        <svg class="companion__mic-flower" width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(0 50 50)"/>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(60 50 50)"/>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(120 50 50)"/>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(180 50 50)"/>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(240 50 50)"/>
            <ellipse cx="50" cy="20" rx="11" ry="20" fill="#1B3A5C" transform="rotate(300 50 50)"/>
          </g>
          <circle cx="50" cy="50" r="24" fill="#D9722C"/>
          <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <rect x="41" y="33" width="18" height="22" rx="9" fill="#ffffff" stroke="none"/>
            <path d="M37,55 Q37,67 50,67 Q63,67 63,55"/>
            <line x1="50" y1="67" x2="50" y2="75"/>
            <line x1="42" y1="75" x2="58" y2="75"/>
          </g>
        </svg>
      </button>
    </form>
  </div>

  <nav class="dashboard-nav" aria-label="Main navigation">
    <a href="/dashboard" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Home</span>
    </a>
    <a href="/companion" class="dashboard-nav__item dashboard-nav__item--active" aria-current="page">
      <span class="dashboard-nav__label">Companion</span>
    </a>
    <a href="/activities" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Activities</span>
    </a>
    <a href="/profile" class="dashboard-nav__item">
      <span class="dashboard-nav__label">Profile</span>
    </a>
  </nav>

  <script src="{{ url_for('static', filename='js/text-utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/companion.js') }}"></script>
</body>
</html>
