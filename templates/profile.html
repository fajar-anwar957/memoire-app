<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile — Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #FAF6EF;
      font-family: Georgia, "Times New Roman", serif;
      color: #1B3A5C;
      padding: 2.5rem 1.5rem 3rem;
    }

    .page {
      max-width: 540px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .header img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .header-brand {
      color: #1B3A5C;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .heading {
      color: #1B3A5C;
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
    }

    .subheading {
      color: #5F5E5A;
      font-size: 1.25rem;
      font-weight: normal;
      margin-bottom: 2rem;
    }

    .card {
      background-color: #FFFFFF;
      border: 2px solid #1B3A5C;
      border-radius: 16px;
      padding: 2rem 2rem 2.5rem;
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.75rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1B3A5C;
      margin-bottom: 0.6rem;
    }

    .field input[type="text"],
    .field input[type="number"] {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1.15rem;
      font-family: Georgia, "Times New Roman", serif;
      color: #2C2C2A;
      background-color: #FAF6EF;
      border: 2px solid #1B3A5C;
      border-radius: 10px;
    }

    .helper-text {
      font-size: 1rem;
      color: #5F5E5A;
      margin-top: 0.5rem;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .checkbox-item input[type="checkbox"] {
      width: 1.35rem;
      height: 1.35rem;
      accent-color: #1B3A5C;
      cursor: default;
    }

    .checkbox-item label {
      font-size: 1.15rem;
      font-weight: normal;
      margin-bottom: 0;
      cursor: default;
    }

    .save-btn {
      display: block;
      width: 100%;
      padding: 1.15rem 1.5rem;
      font-size: 1.35rem;
      font-weight: bold;
      font-family: Georgia, "Times New Roman", serif;
      color: #FFFFFF;
      background-color: #D9722C;
      border: none;
      border-radius: 14px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <img src="{{ url_for('static', filename='assets/memoire-icon.png') }}" alt="Mémoire forget-me-not flower">
      <span class="header-brand">Mémoire</span>
    </header>

    <h1 class="heading">Your Profile</h1>
    <p class="subheading">Let's get to know you.</p>

    <div class="card">
      <div class="field">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name">
      </div>

      <div class="field">
        <label for="preferred-name">Preferred Name</label>
        <input type="text" id="preferred-name" name="preferred-name">
        <p class="helper-text">What would you like to be called?</p>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age">
      </div>

      <div class="field">
        <label for="hometown">Hometown</label>
        <input type="text" id="hometown" name="hometown">
      </div>

      <div class="field">
        <label>Hobbies</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-reading" name="hobbies" value="Reading">
            <label for="hobby-reading">Reading</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-gardening" name="hobbies" value="Gardening">
            <label for="hobby-gardening">Gardening</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-music" name="hobbies" value="Music">
            <label for="hobby-music">Music</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-cooking" name="hobbies" value="Cooking">
            <label for="hobby-cooking">Cooking</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-walking" name="hobbies" value="Walking">
            <label for="hobby-walking">Walking</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="hobby-television" name="hobbies" value="Television">
            <label for="hobby-television">Television</label>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="save-btn">Save Profile</button>
  </div>
</body>
</html>
