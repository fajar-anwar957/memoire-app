<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Mémoire</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base/style.css') }}">
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-cream);
    }

    @keyframes fadeIn {
      from {
        opacity: 0; 
      }
      to {
        opacity: 1;
      }
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 1.5s ease-out forwards;
    }

    .title {
      color: #1B3A5C;
      font-weight: bold;
      font-size: 2.8rem;
      margin-top: 1rem;
    }

    .tagline {
      color: #5F5E5A;
      font-size: 1.1rem;
      font-weight: normal;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="{{ url_for('static', filename='assets/memoire-icon.png') }}" alt="Mémoire forget-me-not flower" width="150" style="object-fit: contain;">
    <h1 class="title">Mémoire</h1>
    <p class="tagline">Your gentle memory companion</p>
  </div>
  <script src="{{ url_for('static', filename='js/core.js') }}"></script>
  <script>
    setTimeout(function () {
      window.location.href = window.MemoireCore.getActiveProfile() ? '/dashboard' : '/profile';
    }, 2500);
  </script>
</body>
</html>
